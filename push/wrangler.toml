# つみかさねの通知サーバー (Cloudflare Workers, the user's call): see worker.js. Deployed by Cloudflare's Workers Builds
# from this folder (root directory: push), as the Worker named below
name = "tsumikasane-push"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

# a Durable Object for each device that turned notifications on, and one that keeps the server's key for Web Push (VAPID)
[[durable_objects.bindings]]
name = "DEVICES"
class_name = "Device"

[[durable_objects.bindings]]
name = "KEYS"
class_name = "Keys"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Device", "Keys"]

[observability]
enabled = true
